services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_explorer}
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research} -d ${POSTGRES_DB:-research_explorer}"]
      interval: 3s
      timeout: 3s
      retries: 20

  collector:
    build: ./services/collector
    environment:
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data:ro
    ports:
      - "18001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    build: ./services/storage
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-research}:${POSTGRES_PASSWORD:-research}@postgres:5432/${POSTGRES_DB:-research_explorer}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./services/ml_service
    environment:
      STORAGE_URL: http://storage:8000
      MODEL_DIR: /models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - model-data:/models
    depends_on:
      storage:
        condition: service_healthy
    ports:
      - "18003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web-master:
    build: ./services/web_master
    environment:
      COLLECTOR_URL: http://collector:8000
      STORAGE_URL: http://storage:8000
      ML_URL: http://ml-service:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      collector:
        condition: service_healthy
      storage:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  visualization:
    build: ./services/visualization
    environment:
      WEB_MASTER_URL: http://web-master:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      web-master:
        condition: service_healthy
    ports:
      - "18050:8050"

volumes:
  postgres-data:
  model-data:
